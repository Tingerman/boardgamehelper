version: '3.8'

services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./data/books:/app/data/books
      - ./data/temp:/app/data/temp
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    # Note: For production with local AI models, ensure adequate memory (at least 4GB RAM)
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G