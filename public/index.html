<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>桌游规则查询系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>桌游规则查询</h1>
      <div class="status" id="status">
        <span class="status-dot"></span>
        <span class="status-text">初始化中...</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Left Sidebar: Books -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>规则书</h2>
          <button class="btn btn-primary btn-sm" id="uploadBtn">+ 添加</button>
        </div>
        <div class="book-list" id="bookList">
          <div class="empty-state">暂无规则书</div>
        </div>
      </aside>

      <!-- Center: Query -->
      <section class="content">
        <div class="query-section">
          <div class="input-group">
            <input
              type="text"
              id="queryInput"
              placeholder="输入问题，如：如何进行生产？"
              autocomplete="off"
            >
            <button class="btn" id="translateInputBtn" title="将输入框中的中文翻译成英文">译为英文</button>
            <button class="btn btn-primary" id="queryBtn">查询</button>
          </div>
          <div class="query-options">
            <label class="checkbox-label">
              <input type="checkbox" id="translateAnswerChk">
              <span>结果译为中文</span>
            </label>
          </div>
        </div>

        <!-- Results -->
        <div class="results-section">
          <div class="results-header">
            <h3>答案</h3>
          </div>
          <div class="results-content" id="results">
            <div class="empty-state">
              左侧添加规则书后，输入问题开始查询
            </div>
          </div>
        </div>

        <!-- Sources -->
        <div class="sources-section" id="sourcesSection" style="display: none;">
          <div class="sources-header">
            <h3>参考来源</h3>
          </div>
          <div class="sources-list" id="sourcesList"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Op Log floating panel -->
  <div class="op-log-panel" id="opLogPanel" hidden>
    <div class="op-log-header">
      <span class="op-log-title">操作日志</span>
      <div class="op-log-actions">
        <button class="op-log-btn" id="opLogClear" title="清空">清空</button>
        <button class="op-log-btn" id="opLogToggle" title="折叠">−</button>
      </div>
    </div>
    <div class="op-log-body" id="opLogBody"></div>
  </div>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>添加规则书</h3>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <!-- 来源切换 -->
        <div class="source-tabs">
          <button class="source-tab active" data-source="pdf">PDF 文件</button>
          <button class="source-tab" data-source="image">图片</button>
          <button class="source-tab" data-source="url">B站 opus URL</button>
        </div>

        <!-- 各来源 panel -->
        <div class="source-panel" data-source="pdf">
          <div class="form-group">
            <label>选择 PDF 文件</label>
            <input type="file" id="pdfInput" accept=".pdf" />
          </div>
        </div>
        <div class="source-panel" data-source="image" hidden>
          <div class="form-group">
            <label>选择图片（可多选）</label>
            <input type="file" id="imageInput" accept="image/*" multiple />
          </div>
          <div class="hint">将串行 OCR 提取文字。支持 jpg/png/webp。</div>
        </div>
        <div class="source-panel" data-source="url" hidden>
          <div class="form-group">
            <label>B站 opus URL</label>
            <input type="text" id="urlInput" placeholder="https://t.bilibili.com/123456789..." />
          </div>
        </div>

        <!-- 共享 metadata 字段（三者全空 = 走 LLM 自动抽取）-->
        <div class="shared-meta">
          <div class="form-group">
            <label>名称（可选）</label>
            <input type="text" id="bookNameInput" placeholder="如：大创造时代" />
          </div>
          <div class="form-group">
            <label>中文名（可选，三者全空时走 LLM 自动抽取）</label>
            <input type="text" id="zhNameInput" placeholder="如：大创造时代" />
          </div>
          <div class="form-group">
            <label>英文名（可选）</label>
            <input type="text" id="enNameInput" placeholder="如：Great Western Trail" />
          </div>
          <div class="form-group">
            <label>简介（可选，约 50 字）</label>
            <textarea id="summaryInput" rows="2" placeholder="一句话介绍游戏玩法或主题"></textarea>
          </div>
        </div>

        <div class="upload-progress" id="uploadProgress" style="display: none;">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-text" id="progressText">处理中...</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="cancelUpload">取消</button>
        <button class="btn btn-primary" id="confirmUpload">上传</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
